<title>BQS 2.0 RecargaBot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de marca, abas fixas no topo, uma coluna de leitura (máx. 1080px) com cartões só onde o dado pede.
   Dark-first (azul-marinho RecargaPay); tema claro redefinido nos mesmos tokens. */
:root{
  color-scheme:dark;
  --bg:#0A2540; --surface:#0F2D4A; --surface-2:#0D2038; --line:#1E3A54; --line-soft:#173049;
  --ink:#EAF2FA; --ink-2:#A9C1D8; --muted:#7BA8CC;
  --brand:#F5A623; --brand-ink:#0A2540; --blue:#5BA7F5;
  --good:#1DB954; --good-bg:rgba(29,185,84,.14);
  --warn:#F5C842; --warn-bg:rgba(245,200,66,.13);
  --crit:#F0605D; --crit-bg:rgba(240,96,93,.15);
  --info:#5BA7F5; --info-bg:rgba(91,167,245,.14);
  --cA:#E8683A; --cB:#D9A100; --cC:#9085E9; --cD:#3987E5; --cR:#19A774; --cE:#7A93AB;
  --track:#173049; --gap:#0F2D4A;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#EAF0F6; --line:#D3DDE8; --line-soft:#E3EAF2;
    --ink:#0B1F33; --ink-2:#3C546B; --muted:#617A91;
    --brand:#F5A623; --brand-ink:#0A2540; --blue:#1A66CC;
    --good:#0A7A33; --good-bg:rgba(10,122,51,.10);
    --warn:#8A5B00; --warn-bg:rgba(245,166,35,.16);
    --crit:#C0302D; --crit-bg:rgba(192,48,45,.10);
    --info:#1A66CC; --info-bg:rgba(26,102,204,.10);
    --cA:#E0541F; --cB:#C98F00; --cC:#6250D6; --cD:#2A78D6; --cR:#12946A; --cE:#7B8794;
    --track:#E3EAF2; --gap:#FFFFFF;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#EAF0F6; --line:#D3DDE8; --line-soft:#E3EAF2;
  --ink:#0B1F33; --ink-2:#3C546B; --muted:#617A91;
  --brand:#F5A623; --brand-ink:#0A2540; --blue:#1A66CC;
  --good:#0A7A33; --good-bg:rgba(10,122,51,.10);
  --warn:#8A5B00; --warn-bg:rgba(245,166,35,.16);
  --crit:#C0302D; --crit-bg:rgba(192,48,45,.10);
  --info:#1A66CC; --info-bg:rgba(26,102,204,.10);
  --cA:#E0541F; --cB:#C98F00; --cC:#6250D6; --cD:#2A78D6; --cR:#12946A; --cE:#7B8794;
  --track:#E3EAF2; --gap:#FFFFFF;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.brandbar{background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding-block:6px}
.brandbar .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top{padding-block:22px 6px}
header.top h1{font-size:clamp(22px,3.6vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.15}
header.top p{color:var(--ink-2);margin-top:6px;max-width:68ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:14px}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font:inherit;font-weight:600;padding:11px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
main{padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}
section.block{display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{color:var(--ink-2);font-size:13px;max-width:78ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.info{background:var(--info-bg);border-color:transparent}
.banner b{font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--muted)}
.dot.warn{background:var(--warn)} .dot.info{background:var(--info)} .dot.crit{background:var(--crit)} .dot.good{background:var(--good)}
/* cartões de rotina */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .name{font-weight:600;font-size:15px}
.card .per{font-size:12px;color:var(--muted)}
.big{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1}
.big small{font-size:18px;font-weight:500;color:var(--ink-2);margin-left:2px}
.delta{font-size:12px;color:var(--ink-2)}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mini b{font-family:var(--mono);font-size:15px;font-weight:500}
.linkbtn{align-self:flex-start;background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:0}
.linkbtn:hover{text-decoration:underline}
/* fichas KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.info{background:var(--info-bg);color:var(--info)}
/* barras */
.seg{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--gap)}
.seg>span{display:block;min-width:2px;height:100%;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(120px,290px) 1fr auto;gap:12px;align-items:center;font-size:13px}
.row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.row .bar{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.row .bar>span{display:block;height:100%;border-radius:0 3px 3px 0}
.row .num{font-family:var(--mono);font-size:12px;min-width:3.4ch;text-align:right}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.inbar{display:flex;align-items:center;gap:8px;min-width:120px}
.inbar .bar{flex:1;height:8px;background:var(--track);border-radius:3px;overflow:hidden}
.inbar .bar>span{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--blue)}
/* oportunidades */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--ink-2);font:inherit;font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opos{display:flex;flex-direction:column;gap:8px}
details.opo{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.opo summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
details.opo summary::-webkit-details-marker{display:none}
details.opo summary::after{content:"›";color:var(--brand);font-size:20px;line-height:1;transition:transform .15s}
details.opo[open] summary::after{transform:rotate(90deg)}
.opo .ttl{font-weight:600;min-width:0}
.opo .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opo .body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line-soft)}
.opo dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:12px 0 0}
.opo dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.opo dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba div{border-radius:8px;padding:10px 12px;font-size:13px}
.ba .antes{background:var(--crit-bg)} .ba .depois{background:var(--good-bg)}
.ba b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.tick{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 18px;color:var(--ink-2);text-align:left}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.seclist{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.seclist li{margin-left:18px}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:flex-start}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.tickets{display:inline-flex;flex-wrap:wrap;gap:4px}
.tickets code{font-size:11px}
.exlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line-soft)}
.exrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.pesas{display:flex;flex-direction:column;gap:10px}
.pesa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pesa-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pesa-t{display:flex;gap:12px;min-width:0}
.pesa-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.pesa .ttl{font-weight:600}
.pesa .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pesa-c{font-size:20px;font-weight:600;text-align:right;white-space:nowrap}
.pesa-c small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.pesa-d{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:13px}
.pesa-d dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.pesa-d dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pesa-d dd b{font-weight:600}
@media(max-width:640px){.pesa-d{grid-template-columns:1fr}.pesa-h{flex-direction:column}.pesa-c{text-align:left}}
.evlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.evlist b{color:var(--ink);font-family:var(--mono);font-weight:500}
.def{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 16px}
.def dt{font-weight:600} .def dd{margin:0;color:var(--ink-2)}
code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media(max-width:640px){
  .row{grid-template-columns:1fr auto}.row .bar{grid-column:1/-1;order:3}
  .opo dl{grid-template-columns:1fr}.ba{grid-template-columns:1fr}
  details.opo summary{grid-template-columns:1fr auto}
  .def{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="brandbar"><div class="wrap"><span>RecargaPay · Bot Quality Score</span><span id="atualizado"></span></div></div>
<header class="top"><div class="wrap">
  <h1>BQS 2.0 · Qualidade do RecargaBot</h1>
  <p>Quanto o bot conduziu bem cada conversa e quantos contatos humanos ele poderia ter evitado. Só conversas do bot; só conteúdo externo da Central de Ajuda.</p>
</div></header>
<nav class="tabs" aria-label="Seções"><div class="wrap" role="tablist" id="tabs"></div></nav>
<div class="wrap"><main id="main" aria-live="polite"><div class="empty"><b>Carregando</b>Buscando os dados mais recentes das rotinas.</div></main></div>
<div class="tip" id="tip" hidden></div>

<script>
(function(){
"use strict";
var FLUXOS=[
  {id:"cartao-hp",nome:"Agente de Cartão de Crédito",desc:"Agentes de cartão de crédito com hiperpersonalização (CC Produção e CC Anuidade)",keys:{semanal:"cartao-hp",mensal:"cartao-hp-mensal"}},
  {id:"aleatorio",nome:"Aleatório",desc:"Amostra aleatória de conversas (filtro do Zendesk)",keys:{semanal:"aleatorio",mensal:"aleatorio-mensal"}},
  {id:"criticos",nome:"Casos críticos",desc:"Conversas com CSAT 1 e 2",keys:{semanal:"criticos-semanal",diario:"criticos-diario",mensal:"criticos-mensal"}}
];
var PERS=[["semanal","Semanal"],["diario","Diário"],["mensal","Mensal"]];
function pers(f){return PERS.filter(function(p){return f.keys[p[0]]})}
function lim(k){return /mensal$/.test(k)?45*86400000:10*86400000}
function perPills(f,atual,attr){
  return '<div class="pills" role="group" aria-label="Período">'+pers(f).map(function(p){return '<button class="pill" data-'+attr+'="'+p[0]+'" aria-pressed="'+(atual===p[0])+'">'+p[1]+'</button>'}).join("")+'</div>';
}
var CLASSES={
  A:{nome:"Bot resolvia hoje",cor:"var(--cA)"},B:{nome:"Resolveria com ajuste",cor:"var(--cB)"},
  C:{nome:"Exigiria capacidade nova",cor:"var(--cC)"},D:{nome:"Só humano resolve",cor:"var(--cD)"},
  R:{nome:"Retido provável",cor:"var(--cR)"},E:{nome:"Indeterminado",cor:"var(--cE)"}
};
var FRENTES={artigo:"Artigos",variavel_hp:"Variáveis e prompts",prompt:"Variáveis e prompts",fluxo:"Fluxo e regras",politica:"Fluxo e regras",capacidade:"Capacidades novas",handoff:"Handoff"};
var GRUPOS=["Todos","Artigos","Variáveis e prompts","Fluxo e regras","Capacidades novas","Handoff"];
var S={data:{},hist:{},bk:{},eventos:[],tab:"visao",per:"semanal",perFluxo:{},filtro:{},metric:"bqs",linhaFluxo:"cartao-hp",linhaPer:"semanal"};
var $=function(s){return document.querySelector(s)};

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){return typeof v==="number"&&isFinite(v)}
function fmt(v,d){if(!num(v))return "—";return v.toLocaleString("pt-BR",{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d})}
function int(v){return num(v)?v.toLocaleString("pt-BR"):"—"}
function g(o,p,d){var x=o;for(var k=p.split("."),i=0;i<k.length;i++){if(x==null)return d;x=x[k[i]]}return x==null?d:x}
function arr(v){return Array.isArray(v)?v:[]}
function load(path){
  var pre=window.BQS_PRELOAD&&window.BQS_PRELOAD[path];
  if(pre)return Promise.resolve(pre);
  return fetch(path,{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
/* aceita nomes antigos (bqs_final, hp) e entrega sempre m.bqs e m.qualidade_dado */
function normRun(d){
  if(!d||!d.metricas)return d;
  var m=d.metricas;
  if(m.bqs==null&&m.bqs_final!=null)m.bqs=m.bqs_final;
  if(m.n_ok==null&&m.n_ok_final!=null)m.n_ok=m.n_ok_final;
  if(!m.qualidade_dado&&m.hp)m.qualidade_dado={n_sem_boas_vindas:m.hp.degradado,pct_sem_boas_vindas:m.hp.pct_degradado};
  return d;
}
function normHist(h){return arr(h).map(function(x){if(x.bqs==null&&x.bqs_final!=null)x.bqs=x.bqs_final;return x}).filter(function(x){return x&&x.fim}).sort(function(a,b){return a.fim<b.fim?-1:1})}
function dia(s){return Date.parse(s+"T12:00:00Z")}
function ddmm(s){return s?String(s).slice(8,10)+"/"+String(s).slice(5,7):""}

/* ---------- peças ---------- */
function chip(txt,tipo){return '<span class="chip '+(tipo||"")+'"><i></i>'+esc(txt)+'</span>'}
function prioChip(p){var m={alta:["Alta","crit"],media:["Média","warn"],baixa:["Baixa",""]};var x=m[p]||["—",""];return chip(x[0],x[1])}
function delta(atual,ant,inverso,ult){
  if(!num(atual)||!num(ant)){
    var u=ult||{};
    return '<span class="delta">sem base de comparação'+(num(u.bqs)?' · último ponto antes da pausa: '+fmt(u.bqs,1)+'%'+(u.fim?' em '+ddmm(u.fim):''):'')+'</span>';
  }
  var d=atual-ant,cls=Math.abs(d)<0.05?"":((d>0)!==!!inverso?"up":"down");
  return '<span class="delta '+cls+'">'+(d>0?"▲ ":d<0?"▼ ":"")+fmt(Math.abs(d),1)+' pp vs período anterior</span>';
}
/* variação do BQS: usa bqs_anterior; senão o semanal anterior no histórico até 10 dias; senão o último ponto (hiato) */
function deltaRun(k,d){
  var m=g(d,"metricas",{}),ant=m.bqs_anterior,ult=m.ultimo_ponto_anterior;
  if(!num(ant)){
    var ini=g(d,"periodo.inicio"),h=S.hist[k]||[],prev=null;
    h.forEach(function(x){if(x.fim<(g(d,"periodo.fim","9999"))&&num(x.bqs))prev=x});
    if(prev&&ini&&(dia(ini)-dia(prev.fim))<=lim(k))ant=prev.bqs;
    else if(prev)ult={bqs:prev.bqs,fim:prev.fim};
  }
  return delta(m.bqs,ant,false,ult);
}
function statusBqs(v){if(!num(v))return "";return v>=80?chip("Saudável","good"):v>=60?chip("Atenção","warn"):chip("Crítico","crit")}
function seg(items,total){
  total=total||items.reduce(function(a,x){return a+(x.n||0)},0);
  if(!total)return '<div class="muted">sem dados</div>';
  var h='<div class="seg" role="img" aria-label="Distribuição">';

/* ---------- linha do tempo ---------- */
var CORES={"cartao-hp":"var(--cD)","aleatorio":"var(--cA)","criticos-semanal":"var(--cR)","criticos-diario":"var(--cC)","cartao-hp-mensal":"var(--cD)","aleatorio-mensal":"var(--cA)","criticos-mensal":"var(--cR)"};
var NOMES={"cartao-hp":"Agente de Cartão de Crédito (semanal)","aleatorio":"Aleatório (semanal)","criticos-semanal":"Casos críticos (semanal)","criticos-diario":"Casos críticos (diário)","cartao-hp-mensal":"Agente de Cartão de Crédito (mensal)","aleatorio-mensal":"Aleatório (mensal)","criticos-mensal":"Casos críticos (mensal)"};
var METRICAS={bqs:{n:"BQS 2.0",f:"bqs"},tfc:{n:"TFC",f:"tfc"},ce:{n:"Contatos evitáveis",f:"ce_pct_total"},rec:{n:"Recontato 24h",f:"pct_recontato_24h"}};
var MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var DIA=86400000;
function metricPills(){
  return '<div class="pills" role="group" aria-label="Métrica">'+Object.keys(METRICAS).map(function(k){return '<button class="pill" data-metric="'+k+'" aria-pressed="'+(S.metric===k)+'">'+METRICAS[k].n+'</button>'}).join("")+'</div>';
}
function eventosTodos(keys){
  var ev=arr(S.eventos).slice(),seen={};
  keys.forEach(function(k){
    var p=null;
    arr(S.hist[k]).forEach(function(x){
      if(p&&x.prompt_version&&p.prompt_version&&x.prompt_version!==p.prompt_version){
        var id=x.fim+"|"+x.prompt_version;
        if(!seen[id]){seen[id]=1;ev.push({tipo:"marco",data:x.fim,titulo:"Versão do prompt do bot mudou: "+p.prompt_version+" → "+x.prompt_version})}
      }
      p=x;
    });
  });
  return ev.filter(function(e){return e&&(e.tipo==="hiato"?(e.inicio&&e.fim):e.data)}).sort(function(a,b){return (a.inicio||a.data)<(b.inicio||b.data)?-1:1});
}
function linhaTempo(keys,opt){
  var mt=METRICAS[S.metric]||METRICAS.bqs;
  var series=keys.map(function(k){return {k:k,p:arr(S.hist[k]).filter(function(x){return num(x[mt.f])})}}).filter(function(s){return s.p.length});
  if(!series.length)return empty("A série começa na primeira rodada","Cada rodada acrescenta um ponto à linha do tempo.");
  var ev=eventosTodos(keys),ts=[];
  series.forEach(function(s){s.p.forEach(function(x){ts.push(dia(x.fim))})});
  ev.forEach(function(e){if(e.tipo==="hiato"){ts.push(dia(e.inicio));ts.push(dia(e.fim))}else ts.push(dia(e.data))});
  var t0=Math.min.apply(null,ts)-6*DIA,t1=Math.max.apply(null,ts)+6*DIA;
  var maxv=100;
  if(mt.f!=="bqs"){maxv=20;series.forEach(function(s){s.p.forEach(function(x){maxv=Math.max(maxv,Math.ceil(x[mt.f]/10)*10)})})}
  var W=760,H=250,L=36,R=14,T=26,B=28;
  var X=function(t){return L+(W-L-R)*(t-t0)/(t1-t0)},Y=function(v){return T+(H-T-B)*(1-v/maxv)};
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Evolução de '+esc(mt.n)+' ao longo do tempo" style="max-width:100%;height:auto">';
  var passo=maxv>50?20:10;
  for(var t=0;t<=maxv;t+=passo){
    var ref=mt.f==="bqs"&&(t===60||t===80);
    svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--line)" stroke-width="'+(ref?1.2:.6)+'" '+(ref?'stroke-dasharray="4 3"':'')+'/><text x="'+(L-6)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--mono)">'+t+'</text>';
  }
  // meses
  var d0=new Date(t0);d0=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,1,12));
  for(var dm=d0;dm.getTime()<t1;dm=new Date(Date.UTC(dm.getUTCFullYear(),dm.getUTCMonth()+1,1,12))){
    var xm=X(dm.getTime());
    svg+='<line x1="'+xm+'" x2="'+xm+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line-soft)" stroke-width=".6"/><text x="'+xm+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+MESES[dm.getUTCMonth()]+(dm.getUTCMonth()===0?"/"+String(dm.getUTCFullYear()).slice(2):"")+'</text>';
  }
  // hiatos (faixas) e marcos
  ev.forEach(function(e,i){
    var n=i+1;
    if(e.tipo==="hiato"){
      var xa=X(dia(e.inicio)),xb=X(dia(e.fim));
      svg+='<rect x="'+xa+'" y="'+T+'" width="'+Math.max(2,xb-xa)+'" height="'+(H-T-B)+'" fill="var(--warn-bg)" data-tip="'+esc(n+" · "+(e.titulo||"Hiato")+" ("+ddmm(e.inicio)+" a "+ddmm(e.fim)+")")+'"/>';
      svg+='<g data-tip="'+esc(n+" · "+(e.titulo||"Hiato"))+'"><circle cx="'+((xa+xb)/2)+'" cy="12" r="8" fill="var(--warn)"/><text x="'+((xa+xb)/2)+'" y="15.5" text-anchor="middle" font-size="10" font-weight="700" fill="var(--brand-ink)">'+n+'</text></g>';
    }else{
      var xe=X(dia(e.data));
      svg+='<line x1="'+xe+'" x2="'+xe+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/><g data-tip="'+esc(n+" · "+ddmm(e.data)+" · "+(e.titulo||""))+'"><circle cx="'+xe+'" cy="12" r="8" fill="var(--ink)"/><text x="'+xe+'" y="15.5" text-anchor="middle" font-size="10" font-weight="700" fill="var(--bg)">'+n+'</text></g>';
    }
  });
  // linhas
  series.forEach(function(s){
    var seg=[],cor=CORES[s.k],prev=null;
    s.p.forEach(function(x){
      var tx=dia(x.fim);
      if(prev&&(tx-prev)>lim(s.k)){svg+='<line x1="'+X(prev)+'" y1="'+Y(s.last)+'" x2="'+X(tx)+'" y2="'+Y(x[mt.f])+'" stroke="'+cor+'" stroke-width="1.5" stroke-dasharray="2 4" opacity=".7"/>';if(seg.length>1)svg+='<polyline fill="none" stroke="'+cor+'" stroke-width="2" stroke-linejoin="round" points="'+seg.join(" ")+'"/>';seg=[]}
      seg.push(X(tx)+","+Y(x[mt.f]));prev=tx;s.last=x[mt.f];
    });
    if(seg.length>1)svg+='<polyline fill="none" stroke="'+cor+'" stroke-width="2" stroke-linejoin="round" points="'+seg.join(" ")+'"/>';
    s.p.forEach(function(x,i){
      svg+='<circle cx="'+X(dia(x.fim))+'" cy="'+Y(x[mt.f])+'" r="'+(i===s.p.length-1?5:3.5)+'" fill="'+(x.cobertura_baixa?"var(--surface)":cor)+'" stroke="'+cor+'" stroke-width="2" data-tip="'+esc(NOMES[s.k]+" · "+(x.periodo_label||ddmm(x.fim))+" · "+mt.n+": "+fmt(x[mt.f],1)+"%"+(x.cobertura_baixa?" (cobertura baixa)":""))+'"/>';
    });
  });
  svg+='</svg>';
  var lg='<div class="legend">'+series.map(function(s){return '<span><i style="background:'+CORES[s.k]+'"></i>'+esc(NOMES[s.k])+'</span>'}).join("")+'<span class="muted">Círculo vazado: cobertura baixa · linha pontilhada: pausa na série'+(mt.f==="bqs"?' · tracejados: 60% e 80% (limiares provisórios)':'')+'</span></div>';
  var lista=ev.length?'<ol class="evlist">'+ev.map(function(e){return '<li><b>'+(e.tipo==="hiato"?ddmm(e.inicio)+" a "+ddmm(e.fim):ddmm(e.data))+'</b> · '+esc(e.titulo||"")+(e.detalhe?' <span class="muted">— '+esc(e.detalhe)+'</span>':'')+'</li>'}).join("")+'</ol>':'';
  return '<div class="panel">'+metricPills()+svg+lg+lista+'</div>';
}
function dcell(cur,prev,f,gapOk){
  if(!prev||!num(cur[f])||!num(prev[f]))return '<td class="n muted">—</td>';
  if(!gapOk)return '<td class="n muted" data-tip="Há uma pausa na série entre os dois pontos">pausa</td>';
  var d=cur[f]-prev[f],bom=f==="bqs"?d>0:d<0,cls=Math.abs(d)<0.05?"":(bom?"up":"down");
  return '<td class="n"><span class="delta '+cls+'">'+(d>0?"▲ ":d<0?"▼ ":"")+fmt(Math.abs(d),1)+'</span></td>';
}
function tabelaPeriodos(k,limite){
  var h=arr(S.hist[k]);
  if(!h.length)return empty("Sem histórico","Esta rotina ainda não tem pontos na linha do tempo.");
  var linhas=h.map(function(x,i){
    var p=i?h[i-1]:null,ok=p?(dia(x.fim)-dia(p.fim))<=lim(k):false;
    return '<tr><td>'+esc(x.periodo_label||x.fim)+(x.cobertura_baixa?' '+chip("cobertura baixa","warn"):'')+'</td><td class="n">'+int(x.n_total)+'</td><td class="n"><b>'+fmt(x.bqs,1)+'%</b></td>'+dcell(x,p,"bqs",ok)+'<td class="n">'+fmt(x.tfc,1)+'%</td>'+dcell(x,p,"tfc",ok)+'<td class="n">'+(num(x.ce_pct_total)?fmt(x.ce_pct_total,0)+'%':'—')+'</td><td class="n">'+esc(x.prompt_version||"—")+'</td></tr>';
  }).reverse().slice(0,limite||30);
  return '<div class="panel scroll"><table><thead><tr><th>Período</th><th class="n">Conversas</th><th class="n">BQS 2.0</th><th class="n">Δ pp</th><th class="n">TFC</th><th class="n">Δ pp</th><th class="n">Evitáveis</th><th class="n">Prompt</th></tr></thead><tbody>'+linhas.join("")+'</tbody></table></div>';
}
function abaLinha(){
  var m=S.linhaPer==="mensal",ks=FLUXOS.map(function(f){return f.keys[m?"mensal":"semanal"]});
  var h='<div class="pills" role="group" aria-label="Período">'+[["semanal","Semanal"],["mensal","Mensal"]].map(function(p){return '<button class="pill" data-lper="'+p[0]+'" aria-pressed="'+(S.linhaPer===p[0])+'">'+p[1]+'</button>'}).join("")+'</div>';
  h+='<section class="block"><h2>Linha do tempo</h2><p class="sub">Uma linha por rotina, uma bolinha por '+(m?"mês":"semana")+'. A faixa amarela marca períodos sem BQS; os círculos numerados são marcos (mudança de regra, de prompt do bot, hiatos). Cada rodada das rotinas acrescenta um ponto.</p>'+linhaTempo(ks)+'</section>';
  var todas=Object.keys(NOMES),k=todas.indexOf(S.linhaFluxo)>=0?S.linhaFluxo:"cartao-hp";

/* ---------- aba de fluxo ---------- */
function fluxo(f){
  var per=fluxoPer(f,S.perFluxo[f.id]||"semanal"),d=fluxoDados(f,per),h=pers(f).length>1?perPills(f,per,"fper"):"";
  if(!d){main(h+'<section class="block"><h2>'+esc(f.nome)+'</h2><p class="sub">'+esc(f.desc)+'</p>'+empty("Esta rotina ainda não publicou dados","Quando rodar, esta aba mostra as métricas, os contatos evitáveis e o que mudar.")+'</section>');return}
  var m=g(d,"metricas",{}),c=g(d,"contencao",{}),a=g(d,"auditoria",{});
  h+='<section class="block"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2>'+esc(g(d,"rotina",f.nome))+'</h2><span class="muted">'+esc(g(d,"periodo.label",""))+' · gerado em '+esc(dt(g(d,"gerado_em")))+'</span></div><p class="sub">'+esc(f.desc)+'</p>';
  if(g(d,"meta.origem")==="teste")h+='<div class="banner info"><span class="dot info"></span><div><b>Rodada de teste.</b> '+esc(g(d,"meta.nota","Dados de validação."))+'</div></div>';
  h+='<div class="kpis">'+
    kpi("BQS 2.0",fmt(m.bqs,1)+'%',deltaRun(fluxoKey(f,per),d))+
    kpi("TFC",fmt(m.tfc,1)+'%','loop, transbordo sem pedido ou abandono após resposta fraca')+
    kpi("Contatos evitáveis",num(c.ce_pct_total)?'≈ '+fmt(c.ce_pct_total,0)+'%':'—',num(c.pct_evitavel)?fmt(c.pct_evitavel,0)+'% das classificadas'+(c.ic95?' (IC '+esc(c.ic95.join("–"))+'%)':''):'sem classificação')+
    kpi("Pediram humano",fmt(m.pct_pediu_humano,1)+'%',int(m.n_total)+' conversas · '+int(m.n_avaliaveis)+' avaliáveis')+
    kpi("Auditados",int(a.auditados),int(a.revisados)+' notas revisadas')+
    (g(m,"calibracao.n_amostra",0)>0?kpi("Calibração",int(m.calibracao.n_amostra)+' lidos',fmt(m.calibracao.taxa_falso_aprovado,0)+'% das aprovações do avaliador não se sustentaram'+(num(m.bqs_avaliador)?' · avaliador: '+fmt(m.bqs_avaliador,1)+'%':'')):'')+
    (num(m.pct_recontato_24h)?kpi("Recontato 24h",fmt(m.pct_recontato_24h,1)+'%','indicador de acompanhamento, fora do BQS 2.0'):'')+
  '</div></section>';
  // alertas
  var pa=arr(d.pontos_atencao);
  if(g(d,"cobertura.baixa"))pa=[{tipo:"warn",texto:"Cobertura baixa: "+g(d,"cobertura.texto","dados incompletos no período")}].concat(pa.map(function(x){return typeof x==="string"?{tipo:"warn",texto:x}:x}));
  else pa=pa.map(function(x){return typeof x==="string"?{tipo:"warn",texto:x}:x});
  if(pa.length)h+='<section class="block"><h2>Pontos de atenção</h2><div class="panel"><ul class="plain">'+pa.map(function(x){return '<li><span class="dot '+esc(x.tipo||"warn")+'"></span><span>'+esc(x.texto)+(arr(x.tickets).length?' '+tix(x.tickets,3):'')+'</span></li>'}).join("")+'</ul></div></section>';
  var sn=g(m,"sinalizados.transbordo_sem_pedido",null);
  if(sn&&sn.n>0)h+='<section class="block"><h2>Sinalizados para análise</h2><div class="panel"><p><b>'+int(sn.n)+' transbordos sem pedido do cliente</b> ('+fmt(sn.pct,1)+'% das conversas). Reprovam o BQS 2.0 e podem ser erro do bot (regra de transbordo, interpretação, integração). Tickets para conferir:</p>'+tix(sn.tickets,3)+'</div></section>';
  // evolução
  var kf=fluxoKey(f,per);
  h+='<section class="block"><h2>Evolução desta rotina</h2>'+linhaTempo([kf])+tabelaPeriodos(kf,8)+'</section>';
  // distribuição
  h+='<section class="block"><h2>Como terminaram as conversas</h2><div class="two"><div class="panel"><h3>Desfecho</h3>'+retSeg(m)+'</div><div class="panel"><h3>Rótulo de qualidade</h3>'+labelsSeg(m)+'</div></div>'+criterios(m)+'</section>';
  if(m.qualidade_dado)h+=qualDado(m.qualidade_dado);
  // dimensões
  var dims=g(d,"dimensoes",{}),dk=Object.keys(dims).filter(function(k){return arr(dims[k]).length});
  if(dk.length){h+='<section class="block"><h2>Qualidade por agente e por tema</h2><p class="sub">Valores originais do avaliador (sem a revisão do auditor). Grupos com menos de 30 conversas não são ranqueados.</p>'+dk.map(function(k){return tabelaDim(k,dims[k])}).join("")+'</section>'}
  // contenção
  h+='<section class="block"><h2>Contatos evitáveis</h2>'+contencao(c,m,d)+'</section>';
  // o que mudar
  h+=mudar(f,d);
  // auditoria
  if(a.auditados!=null){h+='<section class="block"><h2>Auditoria pela transcrição</h2><div class="panel"><p>'+int(a.auditados)+' tickets lidos; '+int(a.revisados)+' com nota revisada ('+int(a.aprovado_para_reprovado)+' passaram de aprovado para reprovado; '+int(a.reprovado_para_aprovado)+' de reprovado para aprovado).</p>'+(arr(a.divergencias).length?'<ul class="plain">'+arr(a.divergencias).map(function(t){return '<li><span class="dot warn"></span><span>'+esc(t)+'</span></li>'}).join("")+'</ul>':'')+'</div></section>'}
  main(h);
}
function dt(s){if(!s)return "—";var x=new Date(s);return isNaN(x)?String(s):x.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"})}
function criterios(m){
  var c=g(m,"criterios",null);if(!c)return "";
  var nomes={resolution:"Resolução",efficiency:"Eficiência",escalation:"Transbordo",understanding:"Entendimento",clarity:"Clareza",tone:"Tom"};

  h+='<div class="opos">'+(lista.length?lista.map(opo).join(""):'<div class="empty"><b>Nada nesta frente</b>Troque o filtro para ver as demais.</div>')+'</div></section>';

}
function bkItem(it){
  var st=BK_STATUS[it.status]||BK_STATUS.aberta,oc=arr(it.ocorrencias),ult=oc[oc.length-1]||{};
  var fl=BK_FLUXOS.filter(function(f){return f[0]===it.fluxo})[0];
  var h='<details class="opo"><summary>'+prioChip(it.prioridade)+'<div><div class="ttl">'+esc(it.id?it.id+" · ":"")+esc(it.titulo)+'</div><div class="meta">'+chip(st[0],st[1])+'<span class="chip">'+esc(fl?fl[1]:it.fluxo)+'</span><span class="chip">'+esc(FR_ROTULO[it.frente]||it.frente||"Ajuste")+'</span><span class="chip">'+esc(it.dono||"—")+'</span>'+
    '<span class="chip">'+oc.length+(oc.length===1?' ocorrência':' ocorrências')+'</span><span class="chip muted">1ª vez '+esc(dataBr(it.criada_em))+' · última '+esc(dataBr(it.ultima_vez))+'</span>'+
    (arr(it.reapareceu_em).length?'<span class="chip crit">Reapareceu depois de '+(it.status==="cancelada"?"cancelada":"concluída")+'</span>':'')+
    (it.origem==="teste"?'<span class="chip info">rodada de teste</span>':'')+'</div></div><span class="mono" style="text-align:right;white-space:nowrap">'+(num(ult.contatos_estimados)?'≈ '+int(ult.contatos_estimados)+'<br><span class="muted" style="font-size:11px">contatos na última</span>':'')+'</span></summary><div class="body">';
  if(it.status==="concluida"||it.status==="cancelada"||it.status==="em_andamento"){
    h+='<div class="banner '+(it.status==="concluida"?"info":"")+'"><span class="dot '+(it.status==="concluida"?"good":"info")+'"></span><div><b>'+esc(st[0])+(it.status_em?' em '+esc(dataBr(it.status_em)):'')+'.</b> '+esc(it.nota||"Sem nota.")+(arr(it.reapareceu_em).length?' <b>Voltou a aparecer em '+arr(it.reapareceu_em).map(dataBr).join(", ")+'.</b>':(it.status==="concluida"?' Sem reaparecer nas rodadas seguintes até agora.':''))+'</div></div>';
  }
  if(it.antes||it.depois)h+='<div class="ba"><div class="antes"><b>Hoje</b>'+esc(it.antes||"—")+'</div><div class="depois"><b>Deveria ser</b>'+esc(it.depois||"—")+'</div></div>';
  h+='<dl>';
  if(it.problema)h+='<dt>O que acontece</dt><dd>'+esc(it.problema)+'</dd>';
  if(it.proposta)h+='<dt>O que ajustar</dt><dd><b>'+esc(it.proposta)+'</b></dd>';
  if(it.no)h+='<dt>Onde mexer</dt><dd>'+esc(it.no)+'</dd>';
  if(it.dependencias&&it.dependencias!=="—")h+='<dt>Depende de</dt><dd>'+esc(it.dependencias)+'</dd>';
  if(it.como_medir)h+='<dt>Como saber que funcionou</dt><dd>'+esc(it.como_medir)+'</dd>';
  h+='</dl>';
  h+='<div class="panel scroll"><h3>Ocorrências</h3><table><thead><tr><th>Período</th><th>Rotina</th><th class="n">Contatos (est.)</th><th>Tickets de exemplo</th></tr></thead><tbody>'+oc.slice().reverse().map(function(o){return '<tr><td>'+esc(o.periodo_label||dataBr(o.fim))+'</td><td>'+esc(o.rotina||"—")+'</td><td class="n">'+(num(o.contatos_estimados)?int(o.contatos_estimados):"—")+'</td><td>'+(tix(o.tickets,3)||'<span class="muted">—</span>')+'</td></tr>'}).join("")+'</tbody></table></div>';
  return h+'</div></details>';
}
function abaBacklog(){
  var todos=bkItens(),f=S.bkF||{fluxo:"todos",status:"abertas"};
  var cont={aberta:0,em_andamento:0,concluida:0,cancelada:0};
  todos.forEach(function(it){cont[it.status]=(cont[it.status]||0)+1});
  var h='<section class="block"><h2>Backlog de ações</h2><p class="sub">Tudo o que as rotinas já levantaram, em ordem de última aparição. O que é novo entra sozinho a cada rodada; quando o mesmo problema reaparece, ele ganha uma ocorrência em vez de virar item novo. O status (aberta, em andamento, concluída ou cancelada) é atualizado a pedido, com data e nota. Se um item concluído ou cancelado voltar a aparecer, o painel avisa.</p>';
  h+='<div class="kpis">'+kpi("Abertas",int(cont.aberta),"aguardando ajuste")+kpi("Em andamento",int(cont.em_andamento),"em análise ou ajuste")+kpi("Concluídas",int(cont.concluida),"ajuste publicado")+kpi("Canceladas",int(cont.cancelada),"não serão feitas")+'</div>';
  h+='<div class="pills" role="group" aria-label="Fluxo">'+[["todos","Todos os fluxos"]].concat(BK_FLUXOS).map(function(x){return '<button class="pill" data-bkf="'+x[0]+'" aria-pressed="'+(f.fluxo===x[0])+'">'+esc(x[1])+'</button>'}).join("")+'</div>';
  h+='<div class="pills" role="group" aria-label="Status">'+[["abertas","Em aberto"],["aberta","Abertas"],["em_andamento","Em andamento"],["concluida","Concluídas"],["cancelada","Canceladas"],["todas","Todas"]].map(function(x){return '<button class="pill" data-bks="'+x[0]+'" aria-pressed="'+(f.status===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>';
  var ra={alta:0,media:1,baixa:2};
  var lista=todos.filter(function(it){
    if(f.fluxo!=="todos"&&it.fluxo!==f.fluxo)return false;
    if(f.status==="todas")return true;
    if(f.status==="abertas")return it.status==="aberta"||it.status==="em_andamento";
    return it.status===f.status;
  }).sort(function(a,b){return (a.ultima_vez<b.ultima_vez?1:a.ultima_vez>b.ultima_vez?-1:0)||((ra[a.prioridade]==null?3:ra[a.prioridade])-(ra[b.prioridade]==null?3:ra[b.prioridade]))||(String(a.id)<String(b.id)?-1:1)});
  h+=lista.length?'<div class="opos">'+lista.map(bkItem).join("")+'</div>':empty("Nenhum item neste filtro","Troque o fluxo ou o status para ver os demais.");
  main(h+'</section>');
}

/* ---------- como ler ---------- */
function comoLer(){
  main('<section class="block"><h2>Como ler este painel</h2><div class="panel"><dl class="def">'+
  '<dt>BQS 2.0</dt><dd>É o resultado final da qualidade do atendimento do bot, igual em todos os fluxos. Uma conversa conta como boa quando passa em duas verificações. <b>1. Conduta:</b> a nota geral (resolução 30%, eficiência 20%, transbordo 20%, entendimento 15%, clareza 10%, tom 5%) é 7 ou mais e resolução e transbordo ficam acima de 2; conversas "regular" reprovam. <b>2. Desfecho:</b> resolvida pelo bot; transferida porque o cliente pediu (fluxo esperado, desde que bem conduzida); ou abandonada depois de uma resposta boa (resolução 7 ou mais), porque o cliente pode sair satisfeito. Loop e transbordo que o cliente não pediu reprovam e são sinalizados para análise. Como o avaliador automático tende a aprovar demais, o BQS 2.0 é <b>calibrado por auditoria</b>: a cada rodada o auditor lê a transcrição de uma amostra aleatória das conversas aprovadas, e a parcela de aprovações que não se sustenta é descontada do número. Nos tickets auditados vale a nota revisada. O BQS 2.0 é sempre um número só, igual em todos os fluxos. O histórico do BQS 2.0 começa em 20/10/2026.</dd>'+
  '<dt>Recontato em 24h</dt><dd>Percentual de conversas cujo cliente voltou a falar com o atendimento em até 24 horas. É um indicador de acompanhamento e não entra no BQS 2.0.</dd>'+
  '<dt>Sinalizados</dt><dd>Transbordos sem pedido do cliente. Reprovam o BQS 2.0 e vão para análise, porque podem ser erro do bot.</dd>'+
  '<dt>Linha do tempo</dt><dd>Cada rodada semanal acrescenta um ponto. A faixa amarela marca períodos sem BQS 2.0 (hiatos) e os círculos numerados são marcos: mudanças de regra, de prompt do bot e pausas. A variação só é calculada contra a semana imediatamente anterior; depois de uma pausa o painel mostra o último ponto conhecido.</dd>'+
  '<dt>TFC</dt><dd>Taxa de falha de condução: conversas em loop, em transbordo que o cliente não pediu ou em abandono depois de uma resposta fraca (resolução abaixo de 7). Abandonar não é falha, e pedir atendente também não: o cliente pode sair ou chamar um humano a qualquer momento. Só conta quando o bot errou.</dd>'+
  '<dt>Contatos evitáveis</dt><dd>Entre as conversas classificadas, as que o bot poderia ter resolvido hoje (A), resolveria com ajuste de conteúdo, variável ou roteamento (B) ou exigiria uma capacidade nova (C). A estimativa para o período vem de uma amostra aleatória e traz intervalo de confiança.</dd>'+
  '<dt>Classes</dt><dd>A bot resolvia hoje · B resolveria com ajuste · C exigiria capacidade nova · D só humano resolve (mede o handoff do bot) · R retido provável · E indeterminado.</dd>'+
  '<dt>Auditoria</dt><dd>Um segundo agente lê a transcrição dos casos duvidosos, refaz as 6 notas e a classe. Tende a mostrar onde o avaliador automático erra, por exemplo aprovar transbordo depois de uma resposta falha.</dd>'+
  '<dt>Cobertura</dt><dd>Quando há poucos dias com dados, a semana é uma amostra reduzida. O painel avisa e não calcula variação sem período anterior.</dd>'+
  '<dt>Escopo</dt><dd>Só conversas do bot, até a primeira fala de um atendente. Só artigos públicos da Central de Ajuda: o que começa com cadeado ou lupa é interno e o bot não consulta.</dd>'+
  '<dt>Limiares</dt><dd>BQS 2.0 abaixo de 60% é crítico e 80% ou mais é saudável. Os limiares de TFC e de pedido de atendente são provisórios até haver 4 períodos de série.</dd>'+
  '<dt>Atualização</dt><dd>As rotinas semanais rodam às segundas (Agente de Cartão de Crédito 10h, Aleatório 14h, Casos críticos 15h) e a rotina diária de críticos às 9h40. Cada rodada atualiza a sua parte do painel.</dd>'+
  '</dl></div></section>');
}

/* ---------- navegação ---------- */
function main(h){$("#main").innerHTML=h}
function tabs(){
  var t=[{id:"visao",n:"Visão geral"},{id:"backlog",n:"Backlog"},{id:"linha",n:"Linha do tempo"}].concat(FLUXOS.map(function(f){return {id:f.id,n:f.nome}})).concat([{id:"como-ler",n:"Como ler"}]);
  $("#tabs").innerHTML=t.map(function(x){return '<button role="tab" data-tab="'+x.id+'" aria-selected="'+(S.tab===x.id)+'">'+esc(x.n)+'</button>'}).join("");
}
function render(){
  tabs();
  var f=FLUXOS.filter(function(x){return x.id===S.tab})[0];
  if(S.tab==="visao")visao();else if(S.tab==="linha")abaLinha();else if(S.tab==="backlog")abaBacklog();else if(S.tab==="como-ler")comoLer();else if(f)fluxo(f);else visao();
  var ult=Object.keys(S.data).map(function(k){return g(S.data[k],"gerado_em")}).filter(Boolean).sort().pop();
  $("#atualizado").textContent=ult?"Atualizado em "+dt(ult):"";
}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-tab],[data-go],[data-crit],[data-filtro],[data-metric],[data-lf],[data-gper],[data-fper],[data-lper],[data-bkf],[data-bks]");if(!el)return;
  if(el.dataset.tab||el.dataset.go){S.tab=el.dataset.tab||el.dataset.go;if(el.dataset.go&&S.per!=="semanal")S.perFluxo[el.dataset.go]=S.per;else if(el.dataset.go)S.perFluxo[el.dataset.go]="semanal";store("bqs-tab",S.tab);window.scrollTo(0,0)}
  if(el.dataset.metric)S.metric=el.dataset.metric;
  if(el.dataset.bkf){S.bkF=S.bkF||{fluxo:"todos",status:"abertas"};S.bkF.fluxo=el.dataset.bkf}
  if(el.dataset.bks){S.bkF=S.bkF||{fluxo:"todos",status:"abertas"};S.bkF.status=el.dataset.bks}
  if(el.dataset.lf)S.linhaFluxo=el.dataset.lf;
  if(el.dataset.gper)S.per=el.dataset.gper;
  if(el.dataset.lper)S.linhaPer=el.dataset.lper;
  if(el.dataset.fper)S.perFluxo[S.tab]=el.dataset.fper;
  if(el.dataset.filtro)S.filtro[S.tab]=el.dataset.filtro;
  render();
});
/* tooltip */
var tip=$("#tip");
document.addEventListener("pointermove",function(e){
  var el=e.target.closest&&e.target.closest("[data-tip]");
  if(!el){tip.hidden=true;return}
  tip.textContent=el.getAttribute("data-tip");tip.hidden=false;
  var x=Math.min(e.clientX+12,window.innerWidth-tip.offsetWidth-8),y=e.clientY+14;
  if(y+tip.offsetHeight>window.innerHeight-8)y=e.clientY-tip.offsetHeight-10;
  tip.style.left=Math.max(8,x)+"px";tip.style.top=y+"px";
});
document.addEventListener("pointerleave",function(){tip.hidden=true});

/* ---------- boot ---------- */
var chaves=["cartao-hp","cartao-hp-mensal","aleatorio","aleatorio-mensal","criticos-semanal","criticos-diario","criticos-mensal"];
var salvo=store("bqs-tab");if(salvo)S.tab=salvo;
Promise.all(chaves.map(function(k){return Promise.all([load("data/"+k+"/latest.json"),load("data/"+k+"/history.json")]).then(function(r){S.data[k]=normRun(r[0]);S.hist[k]=normHist(r[1])})}).concat(["cartao-hp","aleatorio","criticos"].map(function(k){return load("data/backlog/"+k+".json").then(function(r){S.bk[k]=arr(r)})})).concat([load("data/eventos.json").then(function(r){S.eventos=arr(r)})])).then(render);
render();
})();
</script>
